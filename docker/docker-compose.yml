name: reconpoint

services:
  db:
    image: ghcr.io/khulnasoft/reconpoint:reconpoint-postgres-v${RECONPOINT_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: reconpoint-db-1
    entrypoint: /entrypoint.sh
    volumes:
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconpoint -d reconpoint"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - reconpoint_network

  pgbouncer:
    build: ./pgbouncer
    image: edoburu/pgbouncer:latest
    container_name: reconpoint-pgbouncer-1
    env_file:
      - ../.env
    environment:
      - AUTH_TYPE=scram-sha-256
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - LISTEN_ADDR=0.0.0.0
      - LISTEN_PORT=${PGBOUNCER_LISTEN_PORT:-6432}
      - POOL_MODE=${PGBOUNCER_POOL_MODE:-transaction}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-200}
      - DEFAULT_POOL_SIZE=${PGBOUNCER_DEFAULT_POOL_SIZE:-30}
      - SERVER_RESET_QUERY=${PGBOUNCER_SERVER_RESET_QUERY:-DISCARD ALL}
    command: ["/bin/sh", "-c", "sed -i \"s/^user = postgres/user = $$POSTGRES_USER/\" /etc/pgbouncer/pgbouncer.ini; exec pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reconpoint_network

  redis:
    image: ghcr.io/khulnasoft/reconpoint:reconpoint-redis-v${RECONPOINT_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: reconpoint-redis-1
    hostname: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reconpoint_network

  worker:
    image: freelabz/secator:0.26.1
    container_name: secator-worker
    restart: unless-stopped
    entrypoint: /entrypoint.sh
    command: ['worker']
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/opt/reconpoint-ssl-suppress
      - SECATOR_CELERY_RESULT_EXPIRES=3600
    volumes:
      - scan_results:/home/secator/.secator/reports
      - nuclei_templates:/home/secator/nuclei-templates
      - wordlist:/home/secator/.secator/wordlists
      - gf_patterns:/home/secator/.gf
      - ./worker/entrypoint.sh:/entrypoint.sh:ro
      - ./worker/python_ssl_suppress:/opt/reconpoint-ssl-suppress:ro
    depends_on:
      - redis
    networks:
      - reconpoint_network

  web:
    image: ghcr.io/khulnasoft/reconpoint:reconpoint-web-v${RECONPOINT_VERSION}
    env_file:
      - ../.env
    user: reconpoint
    restart: unless-stopped
    container_name: reconpoint-web-1
    entrypoint: /entrypoint.sh
    environment:
      - RECONPOINT_HOME=/home/reconpoint/reconpoint
      - UI_ERROR_LOGGING=0
    volumes:
      - ../web:/home/reconpoint/reconpoint:rw,z
      - ./web/entrypoint.sh:/entrypoint.sh:ro
      - ./docker-compose.worker.yml:/home/reconpoint/docker/docker-compose.worker.yml:ro
      - ./worker:/home/reconpoint/docker/worker:ro
      - reconpoint_ssh_keys:/home/reconpoint/.ssh
      - nuclei_templates:/home/reconpoint/nuclei-templates
      - wordlist:/home/reconpoint/wordlists
      - gf_patterns:/home/reconpoint/.gf
      - scan_results:/home/reconpoint/scan_results
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "http://localhost:8000"]
      interval: 10s
      timeout: 10s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      worker:
        condition: service_started
    networks:
      reconpoint_network:
        aliases:
          - reconpoint

  proxy:
    image: ghcr.io/khulnasoft/reconpoint:reconpoint-proxy-v${RECONPOINT_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: reconpoint-proxy-1
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: proxy.ca
        target: /etc/nginx/certs/reconpoint_chain.pem
      - source: proxy.cert
        target: /etc/nginx/certs/reconpoint.pem
      - source: proxy.key
        target: /etc/nginx/certs/reconpoint_rsa.key
    volumes:
      - ./proxy/config/reconpoint.conf:/etc/nginx/conf.d/reconpoint.conf:ro
      - ../web:/home/reconpoint/reconpoint:rw,z
      - scan_results:/home/reconpoint/scan_results
    networks:
      - reconpoint_network
    ports:
      - 8082:8082/tcp
      - 443:443/tcp

  ollama:
    image: ghcr.io/khulnasoft/reconpoint:reconpoint-ollama-v${RECONPOINT_VERSION}
    env_file:
      - ../.env
    restart: unless-stopped
    container_name: reconpoint-ollama-1
    volumes:
      - ollama_data:/home/reconpoint/.ollama:rw,z
    networks:
      - reconpoint_network

networks:
  reconpoint_network:
    name: reconpoint_network

volumes:
  postgres_data:
    name: reconpoint_postgres_data
  gf_patterns:
    name: reconpoint_gf_patterns
  nuclei_templates:
    name: reconpoint_nuclei_templates
  wordlist:
    name: reconpoint_wordlist
  scan_results:
    name: reconpoint_scan_results
  ollama_data:
    name: reconpoint_ollama_data
  reconpoint_ssh_keys:
    name: reconpoint_ssh_keys


secrets:
  proxy.ca:
    file: ./secrets/certs/reconpoint_chain.pem
  proxy.key:
    file: ./secrets/certs/reconpoint_rsa.key
  proxy.cert:
    file: ./secrets/certs/reconpoint.pem
